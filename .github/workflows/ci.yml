name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build distributable CSS
        run: node scripts/build.mjs
      - name: Run tests
        run: node --test
      - name: Validate component manifest
        run: node scripts/check-component-manifest.mjs
      - name: Enforce bundle size budgets
        run: node scripts/check-bundle-size.mjs
